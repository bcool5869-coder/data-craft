<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Craft: a free data science &amp; AI course</title>
  <meta name="description" content="A free, hands-on data science and AI course. Run real Python in your browser, with a private AI tutor that runs on your device.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f7a5a'/%3E%3Crect x='8' y='15' width='4' height='9' rx='1' fill='%23fff'/%3E%3Crect x='14' y='10' width='4' height='14' rx='1' fill='%23fff'/%3E%3Crect x='20' y='6' width='4' height='18' rx='1' fill='%23f4b23e'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a href="#/" class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="mark-bg"/><rect x="8" y="15" width="4" height="9" rx="1" fill="#fff"/><rect x="14" y="10" width="4" height="14" rx="1" fill="#fff"/><rect x="20" y="6" width="4" height="18" rx="1" fill="#f4b23e"/></svg>
      Data Craft</a>
    <nav class="header-actions">
      <a href="#/courses" class="pill link">Free courses</a>
      <button id="py-status" type="button" class="pill" title="Python runs in your browser. Click to stop running code.">Python</button>
      <button id="ai-status" type="button" class="pill">AI tutor</button>
    </nav>
  </header>

  <main id="main"></main>

  <footer class="site-footer">
    <p>Free course. Python by <a href="https://pyodide.org">Pyodide</a>, AI tutor by
      <a href="https://huggingface.co/openbmb">MiniCPM5</a> on <a href="https://github.com/ngxson/wllama">wllama</a>,
      all running in your browser. Datasets are synthetic, or bundled with scikit-learn.</p>
  </footer>

  <dialog id="model-dialog">
    <h2>Load the AI tutor</h2>
    <p>The model downloads once and then runs on your own device. Nothing you type is sent anywhere.</p>
    <div id="model-options"></div>
    <div class="actions"><button id="model-close" type="button">Close</button></div>
  </dialog>

  <noscript>This course needs JavaScript enabled.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
